[package]
name = "rlearn"
version = "0.1.2"
edition = "2021"

[lib]
name = "rlearn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
futures-util = "0.3.34"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
pdf-extract = "0.12.1"
portable-pty = "0.9.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1.53.2", features = ["process", "io-util"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt"] }

[profile.release]
opt-level = "s"     # size over raw speed; the app's hot paths are network-bound
lto = true
codegen-units = 1
strip = true        # panic stays "unwind": PDF import catches parser panics
