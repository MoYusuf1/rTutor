<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rTutor</title>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <aside id="sidebar">
    <div id="side-grip" title="Drag to resize"></div>
    <header class="brand">
      <span class="wordmark"><img class="mark" src="/src/mark.png" alt="">rTutor</span>
      <button id="collapse" class="icon" data-icon="sidebar" title="Hide sidebar"></button>
    </header>
    <nav class="actions">
      <button id="new-subject" class="act"><span data-icon="edit"></span>New subject</button>
      <button id="search-btn" class="act"><span data-icon="search"></span>Search</button>
      <input id="search-input" type="search" aria-label="Search lessons" placeholder="Search lessons" spellcheck="false" hidden>
    </nav>
    <div id="side-scroll">
      <div id="results" class="list" hidden></div>
      <div id="sections">
        <section id="pinned-sec" hidden><h3>Pinned</h3><div id="pinned"></div></section>
        <section><h3>Subjects</h3><div id="tree" role="tree"></div></section>
      </div>
    </div>
    <div id="pop" hidden></div>
    <div class="foot">
      <button id="model" class="model" aria-haspopup="true"><span id="who-logo"></span><span class="who"><span id="who"></span><small id="who-sub"></small></span></button>
      <button id="term-btn" class="icon" data-icon="terminal" title="Terminal (Ctrl+`)"></button>
    </div>
  </aside>
  <button id="expand" class="icon floating" data-icon="sidebar" title="Show sidebar"></button>

  <main id="start">
    <form id="start-form">
      <div id="crumb" class="crumb"></div>
      <h1 id="start-title">What do you want to learn?</h1>
      <div class="start-box">
        <textarea id="start-input" rows="3" aria-label="What do you want to learn?"></textarea>
        <div class="start-foot">
          <div id="materials" class="chips"></div>
          <button type="button" id="attach" class="icon" data-icon="clip" title="Add material: PDF, transcript, notes"></button>
          <button id="start-btn" class="primary">Start</button>
        </div>
      </div>
      <div id="gears" class="gears" role="radiogroup" aria-label="How to start"></div>
      <section id="library" hidden>
        <h2>Material</h2>
        <div id="library-list"></div>
        <button type="button" id="add-material" class="add"><span data-icon="plus"></span>Add a textbook, slides, notes or a transcript</button>
      </section>
    </form>
  </main>

  <main id="lesson" hidden>
    <div class="tools">
      <button id="pomo" class="pomo" title="Focus timer"><span class="ring"></span><span data-icon="timer"></span><span id="pomo-time">Focus</span></button>
      <button id="sources-btn" class="sources-btn" aria-expanded="false" title="Sources"><span data-icon="sources"></span>Sources<span id="sources-count"></span></button>
    </div>
    <div id="pomo-pop" hidden></div>
    <div id="sources-pop" hidden></div>
    <section id="canvas" aria-label="Lesson">
      <header class="canvas-head">
        <h1 id="title"></h1>
        <details id="notes" class="notes" hidden><summary>Tutor's notes</summary><div id="notes-body"></div></details>
      </header>
      <article id="canvas-body"></article>
    </section>
    <aside id="chat" aria-label="Chat">
      <div id="chat-grip" title="Drag to resize"></div>
      <div id="log" aria-live="polite"></div>
      <div id="suggest" class="suggest"></div>
      <form id="composer">
        <button type="button" id="plus" class="icon" data-icon="plus" title="Add material to this subject"></button>
        <textarea id="input" rows="1" aria-label="Message" placeholder="Ask your tutor…"></textarea>
        <button class="send" data-icon="send" aria-label="Send"></button>
      </form>
    </aside>
  </main>

  <main id="doc" hidden>
    <article>
      <header class="canvas-head"><h1 id="doc-title"></h1><span id="doc-words" class="muted"></span></header>
      <div id="doc-body"></div>
    </article>
  </main>

  <section id="drawer" hidden aria-label="Terminal">
    <div id="drawer-grip" title="Drag to resize"></div>
    <div class="drawer-bar">
      <button type="button" id="logtab" class="dtab"><span data-icon="log"></span>Log</button>
      <div id="ttabs"></div>
      <button id="tnew" class="icon" data-icon="plus" title="New terminal"></button>
      <span class="spacer"></span>
      <button id="drawer-close" class="icon" data-icon="x" aria-label="Hide terminal"></button>
    </div>
    <form id="where" class="where">
      <p>Where should the terminal open?</p>
      <div class="where-opts" hidden>
        <label>Model <select id="where-model"></select></label>
        <label>Effort <select id="where-effort"></select></label>
      </div>
      <div class="where-row">
        <button type="button" id="where-dir" class="dir"></button>
        <button class="primary">Open</button>
      </div>
    </form>
    <div id="shells"></div>
    <div id="logpane" hidden>
      <div class="log-bar"><span id="log-path"></span><button type="button" id="log-copy" class="ghost">Copy</button></div>
      <div id="log-lines"></div>
    </div>
  </section>

  <div id="menu" role="menu" hidden></div>
  <dialog id="confirm" class="confirm">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="confirm-row">
        <button value="cancel" class="ghost">Cancel</button>
        <button value="ok" class="danger-btn" id="confirm-ok"></button>
      </div>
    </form>
  </dialog>
  <div id="dropping" hidden><p>Drop to add as material</p></div>

  <dialog id="settings">
    <form method="dialog">
      <header>
        <h2>API provider</h2>
        <button value="close" class="icon" data-icon="x" aria-label="Close"></button>
      </header>
      <div id="p-list" class="segmented" role="radiogroup" aria-label="Provider"></div>
      <label>Model <input id="p-model" spellcheck="false"></label>
      <label id="p-base-row">URL <input id="p-base" spellcheck="false"></label>
      <label id="p-key-row">Key <input id="p-key" type="password" autocomplete="off"></label>
      <button id="p-test" type="button" class="wide">Test connection</button>
      <p id="p-status" role="status" aria-live="polite"></p>
      <button value="save" class="primary wide">Use this provider</button>
    </form>
  </dialog>
</body>
</html>
